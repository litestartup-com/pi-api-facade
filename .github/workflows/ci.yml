name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The whole gate is offline: unit tests use the fake engine, integration
      # tests use a scripted local stub provider (no keys, no external calls).
      - run: npm run check

  docker-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build the thin runtime image
        run: docker build -f docker/Dockerfile -t pi-api-facade:ci .
      - name: Boot the compose stack (fake engine, no secrets needed)
        run: |
          mkdir -p workspaces
          printf 'PI_FACADE_ENGINE=fake\nPI_FACADE_API_KEYS=ci-smoke-key\nHTTP_PORT=8090\nFACADE_VERSION=ci\n' > .env
          docker compose up -d
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8090/api-gw/v1/health >/dev/null 2>&1; then
              echo "facade healthy behind nginx"; exit 0
            fi
            sleep 2
          done
          echo "facade never became healthy" >&2; exit 1
      - name: Wiring smoke through the nginx front door
        run: FACADE_URL=http://127.0.0.1:8090 FACADE_KEY=ci-smoke-key node scripts/compose-smoke.mjs
      - name: Stack logs (on failure)
        if: failure()
        run: docker compose logs --tail=80
      - name: Tear down
        if: always()
        run: docker compose down -v

  demos-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The demo BFFs/UI are single-sourced in the gateway repo; the overlay
      # builds them from this checkout (see examples/demos/compose.demos.yml).
      - uses: actions/checkout@v4
        with:
          repository: litestartup-com/dsh-api-gateway
          path: gateway-src
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/sync-demo-docs.mjs
      - name: Validate the merged compose config (fail fast on merge/interp errors)
        run: |
          printf 'PI_FACADE_ENGINE=fake\nPI_FACADE_API_KEYS=ci-smoke-key\nHTTP_PORT=8090\nFACADE_VERSION=ci\nGATEWAY_DIR=./gateway-src\n' > .env
          docker compose -f docker-compose.yml -f examples/demos/compose.demos.yml config --quiet
      - name: Boot base + demos overlay (fake engine, no secrets needed)
        run: |
          mkdir -p workspaces/kb workspaces/cs
          diagnostics() {
            # Per-service annotations: job logs need a login to read, check-run
            # annotations are public — this is the self-service failure channel.
            echo "::error title=demos-ps::$(docker compose -f docker-compose.yml -f examples/demos/compose.demos.yml ps -a 2>&1 | tr '\n' '|' | tail -c 1400)"
            echo "::error title=demos-kb-logs::$(docker compose -f docker-compose.yml -f examples/demos/compose.demos.yml logs --tail=30 kb-demo 2>&1 | tr '\n' '|' | tail -c 1400)"
            echo "::error title=demos-cs-logs::$(docker compose -f docker-compose.yml -f examples/demos/compose.demos.yml logs --tail=30 cs-demo 2>&1 | tr '\n' '|' | tail -c 1400)"
            echo "::error title=demos-nginx-logs::$(docker compose -f docker-compose.yml -f examples/demos/compose.demos.yml logs --tail=15 nginx 2>&1 | tr '\n' '|' | tail -c 700)"
            docker compose -f docker-compose.yml -f examples/demos/compose.demos.yml logs --tail=60 >&2 || true
          }
          if ! docker compose -f docker-compose.yml -f examples/demos/compose.demos.yml up -d --build; then
            echo "compose up failed" >&2
            diagnostics
            exit 1
          fi
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8090/kb/api/health >/dev/null 2>&1 && curl -fsS http://127.0.0.1:8090/cs/api/health >/dev/null 2>&1; then
              echo "demos healthy behind nginx"; exit 0
            fi
            sleep 3
          done
          echo "demos never became healthy" >&2
          diagnostics
          exit 1
      - name: Demo smoke (pages, file CRUD, doc sync, chat rounds over SSE)
        run: DEMO_BASE=http://127.0.0.1:8090 node scripts/demo-smoke.mjs
      - name: Stack logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.yml -f examples/demos/compose.demos.yml logs --tail=80
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f examples/demos/compose.demos.yml down -v
