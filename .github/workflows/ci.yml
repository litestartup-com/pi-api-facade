name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The whole gate is offline: unit tests use the fake engine, integration
      # tests use a scripted local stub provider (no keys, no external calls).
      - run: npm run check
