# Fail-closed front door for the standalone Pi API node.
#
# Only the facade prefix (/api-gw/) is proxied; everything else gets a plain
# 404. The facade itself enforces API-key auth and a deny-by-default method
# whitelist behind this door (two independent layers).
#
# The route prefix is deliberately NOT configurable here: /api-gw/v1 is the
# frozen wire contract default, and keeping exactly one wiring shape is a
# deployment red line. Changing the facade prefix means changing this file.

# Standard WebSocket upgrade mapping (the mux endpoint upgrades under the same prefix).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Docker's embedded DNS, re-resolved every 10s: a recreated facade container
    # gets a new IP without needing an nginx restart (the static-proxy_pass trap).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Facade API: unary RPC, respond receipts, card recovery, sandbox-mode, and
    # the mux WebSocket all live under this prefix.
    location /api-gw/ {
        set $facade http://facade:3091;
        proxy_pass $facade;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (events.mux) + long-lived streaming responses
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Optional add-on locations (examples/demos mounts its /kb/ and /cs/ BFFs
    # here via the compose overlay). The glob include is a no-op when the
    # directory is empty, so the fail-closed default below remains the whole
    # story for a base stack.
    include /etc/nginx/conf.d/locations.d/*.conf;

    # Fail closed: nothing else is reachable from outside.
    location / {
        return 404;
    }
}

# TLS: not wired in v1. When adding it, mount certs read-only and add a
# `listen 443 ssl;` server block reusing the two locations above.
